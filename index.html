<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>新新和善善</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #fff8e1 100%);
      height: 100vh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .header {
      text-align: center; padding: 2.5vh 0 0;
    }
    .header h1 { font-size: 5vh; color: #e65100; letter-spacing: 6px; }
    .header p { font-size: 2.5vh; color: #8d6e63; }

    .mains {
      flex: 1; display: flex; justify-content: center; align-items: center;
      gap: 5vw; padding: 2vh 5vw;
    }
    .char {
      flex: 1; max-width: 40vw; display: flex; flex-direction: column; align-items: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .char:active { transform: scale(0.97); }
    .char-img {
      width: 100%; aspect-ratio: 1;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      background: white; position: relative;
    }
    .char-img img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .char.listening .char-img {
      box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 8px #4caf50;
      animation: listenPulse 0.8s ease-in-out infinite;
    }
    @keyframes listenPulse {
      0%,100% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 8px #4caf50; }
      50% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 25px rgba(76,175,80,0); }
    }

    .char.speaking .char-img {
      animation: bounce 0.3s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .char-name {
      font-size: 4vh; font-weight: bold; color: white;
      padding: 1vh 5vw; border-radius: 40px; margin-top: 1vh;
      pointer-events: none;
    }
    .char:nth-child(1) .char-name { background: #66bb6a; }
    .char:nth-child(2) .char-name { background: #ff9800; }
    .char-hint {
      font-size: 2vh; color: #8d6e63; margin-top: 0.5vh;
      pointer-events: none;
    }
    .char-status { font-size: 2vh; margin-top: 0.3vh; pointer-events: none; }

    .status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95); padding: 1.5vh;
      text-align: center; font-size: 2.2vh; color: #555;
      z-index: 100; display: none;
    }

    .reply {
      position: fixed; bottom: 10vh; left: 50%; transform: translateX(-50%);
      background: white; padding: 3vh 6vw; border-radius: 24px;
      font-size: 3.5vh; text-align: center; z-index: 99;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 80vw; line-height: 1.6;
      animation: popIn 0.4s ease; pointer-events: none;
      display: none;
    }
    .reply.xinxin { border: 4px solid #66bb6a; }
    .reply.shanshan { border: 4px solid #ff9800; }
    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .reply-label { font-size: 2.2vh; color: #888; margin-bottom: 0.5vh; }
  </style>
</head>
<body>
  <div class="header">
    <h1>新新 & 善善</h1>
    <p>闽南布偶戏服装设计</p>
  </div>

  <div class="mains">
    <div class="char" id="card-xinxin" data-char="xinxin">
      <div class="char-img"><img src="img/xinxin.jpg" alt="新新"></div>
      <div class="char-name">新新</div>
      <div class="char-hint">点我跟新新聊天</div>
      <div class="char-status" style="color:#66bb6a"></div>
    </div>
    <div class="char" id="card-shanshan" data-char="shanshan">
      <div class="char-img"><img src="img/shanshan.jpg" alt="善善"></div>
      <div class="char-name">善善</div>
      <div class="char-hint">点我跟善善聊天</div>
      <div class="char-status" style="color:#ff9800"></div>
    </div>
  </div>

  <div class="status-bar" id="statusBar"></div>
  <div class="reply" id="reply"></div>

  <script>
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var API_KEY = '***';
    var LLM_API = 'https://api.deepseek.com/v1/chat/completions';

    var recognition = null;
    var isBusy = false;
    var initialized = false;
    var speakQueue = [];

    var PROMPTS = {
      xinxin: '你是"新新"，绿色青蛙布偶，闽南布偶戏服装设计师。性格活泼好奇。说话要简单可爱像对五岁小孩。每次1-2句话，短！',
      shanshan: '你是"善善"，棕色狮子布偶，闽南布偶戏服装设计师。性格温柔善良。说话要简单可爱像对五岁小孩。每次1-2句话，短！'
    };

    // ========== 点击角色 ==========
    function onCharClick(who) {
      if (isBusy) return;
      if (!initialized) {
        initialized = true;
        document.querySelectorAll('.char-hint').forEach(function(el) { el.textContent = '👆 点我跟' + (who==='xinxin'?'新新':'善善') + '说话'; });
      }
      listenAndReply(who);
    }

    // ========== 听→识别→回复 ==========
    function listenAndReply(who) {
      if (isBusy) return;
      isBusy = true;
      var name = who === 'xinxin' ? '新新' : '善善';
      
      var card = document.getElementById('card-' + who);
      var statusEl = card.querySelector('.char-status');
      card.classList.add('listening');
      statusEl.textContent = '🎤 正在听...';
      showStatus('🎤 ' + name + '在听你说话，说完请稍等~');
      hideReply();

      if (!SpeechRecognition) {
        statusEl.textContent = '❌ 不支持';
        showStatus('❌ 请用Safari打开');
        setTimeout(function() { isBusy = false; card.classList.remove('listening'); }, 2000);
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      var finalText = '';

      recognition.onresult = function(event) {
        var t = '';
        for (var i = 0; i < event.results.length; i++) t += event.results[i][0].transcript;
        if (t) statusEl.textContent = '🎧 ' + t;
        if (event.results[event.results.length-1].isFinal) finalText = t;
      };

      recognition.onerror = function(event) {
        console.log('Err:', event.error);
        card.classList.remove('listening');
        statusEl.textContent = '';
        
        if (event.error === 'no-speech') {
          showStatus('👂 没听到声音哦，再点一下试试');
        } else if (event.error === 'not-allowed') {
          showStatus('❌ 需要允许麦克风，去设置打开再刷新');
        } else if (event.error === 'aborted') {
          showStatus('');
        } else {
          showStatus('😅 没听清，再点一次');
        }
        
        setTimeout(function() { isBusy = false; hideStatus(); }, 2000);
      };

      recognition.onend = function() {
        card.classList.remove('listening');
        statusEl.textContent = '';
        
        if (finalText && finalText.trim().length > 0) {
          statusEl.textContent = '💭';
          var text = finalText.trim();
          console.log('识别:', text);
          doReply(who, text);
        } else {
          isBusy = false;
          hideStatus();
        }
      };

      try {
        recognition.start();
      } catch(e) {
        card.classList.remove('listening');
        statusEl.textContent = '';
        isBusy = false;
      }
    }

    // ========== AI 回复 ==========
    async function doReply(who, text) {
      var name = who === 'xinxin' ? '新新' : '善善';
      var card = document.getElementById('card-' + who);
      var statusEl = card.querySelector('.char-status');
      
      card.classList.add('speaking');
      statusEl.textContent = '💭 思考中...';
      showStatus('💭 ' + name + '在想怎么回答...');

      try {
        var reply = await callLLM(who, text);
        showReply(who, name, reply);
        statusEl.textContent = '🔊';
        
        await speak(reply);
      } catch(e) {
        console.error('LLM错误:', e);
        showStatus('😅 ' + name + '走神了');
      }

      card.classList.remove('speaking');
      statusEl.textContent = '';
      hideStatus();
      
      setTimeout(function() { isBusy = false; }, 500);
    }

    // ========== DeepSeek ==========
    async function callLLM(who, text) {
      var res = await fetch(LLM_API, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': '***' + API_KEY
        },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [
            { role: 'system', content: PROMPTS[who] },
            { role: 'user', content: text }
          ],
          max_tokens: 150,
          temperature: 0.9
        })
      });
      var data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    }

    // ========== 语音朗读 ==========
    function speak(text) {
      return new Promise(function(resolve) {
        if (!window.speechSynthesis) { resolve(); return; }
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 1.0;
        u.pitch = 1.2;
        u.volume = 1.0;
        u.onend = function() { resolve(); };
        u.onerror = function() { resolve(); };
        window.speechSynthesis.speak(u);
      });
    }

    // ========== UI ==========
    function showStatus(msg) {
      var el = document.getElementById('statusBar');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideStatus() {
      document.getElementById('statusBar').style.display = 'none';
    }
    function showReply(who, name, text) {
      var el = document.getElementById('reply');
      el.className = 'reply ' + who;
      el.innerHTML = '<div class="reply-label">' + name + '说：</div>' + text;
      el.style.display = 'block';
      clearTimeout(el._to);
      el._to = setTimeout(function() { el.style.display = 'none'; }, 20000);
    }
    function hideReply() {
      document.getElementById('reply').style.display = 'none';
    }

    // ========== 绑定 ==========
    document.getElementById('card-xinxin').addEventListener('click', function() { onCharClick('xinxin'); });
    document.getElementById('card-shanshan').addEventListener('click', function() { onCharClick('shanshan'); });
  </script>
</body>
</html>
