<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>新新和善善</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #fff8e1 100%);
      height: 100vh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .header { text-align: center; padding: 2.5vh 0 0; }
    .header h1 { font-size: 5vh; color: #e65100; letter-spacing: 6px; }
    .header p { font-size: 2.5vh; color: #8d6e63; }

    .mains {
      flex: 1; display: flex; justify-content: center; align-items: center;
      gap: 5vw; padding: 2vh 5vw;
    }
    .char {
      flex: 1; max-width: 40vw; display: flex; flex-direction: column; align-items: center;
    }
    .char-img {
      width: 100%; aspect-ratio: 1; border-radius: 28px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15); background: white;
    }
    .char-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .char.speaking .char-img { animation: bounce 0.3s ease-in-out infinite alternate; }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    .char.listening .char-img {
      box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 6px #4caf50;
    }
    .char-name {
      font-size: 4vh; font-weight: bold; color: white;
      padding: 1vh 5vw; border-radius: 40px; margin-top: 1vh;
    }
    .char:nth-child(1) .char-name { background: #66bb6a; }
    .char:nth-child(2) .char-name { background: #ff9800; }

    .reply {
      position: fixed; bottom: 10vh; left: 50%; transform: translateX(-50%);
      background: white; padding: 3vh 6vw; border-radius: 24px;
      font-size: 3.5vh; text-align: center; z-index: 99;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 80vw; line-height: 1.6;
      animation: popIn 0.4s ease; pointer-events: none;
      display: none;
    }
    .reply.xinxin { border: 4px solid #66bb6a; }
    .reply.shanshan { border: 4px solid #ff9800; }
    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .reply-label { font-size: 2.2vh; color: #888; margin-bottom: 0.5vh; }

    .status {
      position: fixed; top: 1vh; left: 0; right: 0; text-align: center;
      font-size: 2vh; color: #888; z-index: 98; pointer-events: none;
    }

    .start-btn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: linear-gradient(135deg, #66bb6a, #43a047);
      color: white; border: none;
      padding: 4vh 12vw; font-size: 5vh; border-radius: 60px;
      font-weight: bold; cursor: pointer; z-index: 200;
      box-shadow: 0 10px 40px rgba(76,175,80,0.5);
      letter-spacing: 4px;
      animation: btnPulse 2s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,-50%) scale(1.05); }
    }

    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 199;
      display: flex; justify-content: center; align-items: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>新新 & 善善</h1>
    <p>闽南布偶戏服装设计</p>
  </div>

  <div class="mains">
    <div class="char" id="card-xinxin">
      <div class="char-img"><img src="img/xinxin.jpg" alt="新新"></div>
      <div class="char-name">新新</div>
    </div>
    <div class="char" id="card-shanshan">
      <div class="char-img"><img src="img/shanshan.jpg" alt="善善"></div>
      <div class="char-name">善善</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <button class="start-btn" id="startBtn" onclick="start()">🎤 开始</button>
  </div>

  <div class="status" id="status"></div>
  <div class="reply" id="reply"></div>

  <script>
    var API_KEY = '***';
    var LLM_API = 'https://api.deepseek.com/v1/chat/completions';
    var ASR_API = '/asr';

    var running = false;
    var busy = false;
    var stream = null;
    var recorder = null;
    var chunks = [];

    var PROMPTS = {
      xinxin: '你是"新新"，绿色青蛙布偶，闽南布偶戏服装设计师。活泼好奇。对五岁小孩说话，简单可爱。1-2句话，短！',
      shanshan: '你是"善善"，棕色狮子布偶，闽南布偶戏服装设计师。温柔善良。对五岁小孩说话，简单可爱。1-2句话，短！'
    };

    function start() {
      document.getElementById('overlay').style.display = 'none';
      running = true;
      setStatus('🎤 大家在聊，新新善善都在听~');
      
      // 打招呼
      setTimeout(function() { doSay('xinxin', '小朋友们好！我是新新，今天我们一起设计闽南布偶戏的漂亮衣服！你们想给布偶穿什么颜色的衣服呀？'); }, 800);
      setTimeout(function() { doSay('shanshan', '大家好呀！我是善善，我最喜欢看小朋友们设计的衣服了！'); }, 4500);
      
      // 开始录制
      setTimeout(startRecording, 7000);
    }

    // ========== 持续录音 + 每4秒送识别 ==========
    async function startRecording() {
      if (!running) return;
      if (busy) { setTimeout(startRecording, 1500); return; }
      
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        
        recorder.ondataavailable = function(e) { chunks.push(e.data); };
        
        recorder.onstop = async function() {
          var blob = new Blob(chunks, { type: 'audio/webm' });
          chunks = [];
          
          if (blob.size < 1000) {
            // 太小，跳过
            if (running) setTimeout(startRecording, 500);
            return;
          }

          // 送后端识别
          try {
            var res = await fetch(ASR_API, {
              method: 'POST',
              headers: { 'Content-Type': 'application/octet-stream' },
              body: blob
            });
            var data = await res.json();
            var text = (data.text || '').trim();

            if (text && text.length > 1) {
              console.log('识别:', text);
              var who = detect(text);
              if (who) {
                handleSpeech(who, text);
              }
            }
          } catch(e) {
            console.error('ASR出错:', e);
          }

          if (running && !busy) setTimeout(startRecording, 800);
        };

        recorder.start();
        
        // 每4秒切一段送识别
        setTimeout(function() {
          if (recorder && recorder.state === 'recording') {
            recorder.stop();
          }
        }, 4000);

      } catch(e) {
        console.error('录音出错:', e);
        setStatus('❌ 麦克风权限未开启');
        setTimeout(function() { if (running) startRecording(); }, 3000);
      }
    }

    function detect(text) {
      var t = text.replace(/[，。！？、\s，。！？\s]/g, '').toLowerCase();
      if (t.indexOf('新') >= 0 || t.indexOf('青蛙') >= 0) return 'xinxin';
      if (t.indexOf('善') >= 0 || t.indexOf('狮子') >= 0 || t.indexOf('善善') >= 0) return 'shanshan';
      // 听听内容判断
      if (t.indexOf('新新') >= 0 || t.indexOf('绿') >= 0) return 'xinxin';
      if (t.indexOf('棕') >= 0 || t.indexOf('黄') >= 0) return 'shanshan';
      return null;
    }

    async function handleSpeech(who, text) {
      if (busy) return;
      busy = true;
      
      // 停止录制
      if (recorder && recorder.state === 'recording') {
        try { recorder.stop(); } catch(e) {}
      }
      if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
      
      var name = who === 'xinxin' ? '新新' : '善善';
      var card = document.getElementById('card-' + who);
      
      card.classList.add('speaking');
      setStatus('💭 ' + name + '在想...');

      try {
        var reply = await callLLM(who, text);
        showReply(who, name, reply);
        setStatus('🔊 ' + name + '在说话...');
        await speak(reply);
      } catch(e) {
        console.error('AI出错:', e);
      }

      card.classList.remove('speaking');
      setStatus('🎤');
      
      setTimeout(function() {
        busy = false;
        if (running) startRecording();
      }, 2000);
    }

    async function doSay(who, text) {
      busy = true;
      var name = who === 'xinxin' ? '新新' : '善善';
      var card = document.getElementById('card-' + who);
      
      card.classList.add('speaking');
      showReply(who, name, text);
      setStatus('🔊 ' + name + '在说话...');
      await speak(text);
      card.classList.remove('speaking');
      setStatus('🎤');
      
      setTimeout(function() { busy = false; }, 1500);
    }

    async function callLLM(who, text) {
      var res = await fetch(LLM_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': '***' + API_KEY },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [
            { role: 'system', content: PROMPTS[who] },
            { role: 'user', content: text }
          ],
          max_tokens: 150, temperature: 0.9
        })
      });
      var data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    }

    function speak(text) {
      return new Promise(function(resolve) {
        if (!window.speechSynthesis) { resolve(); return; }
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 1.0; u.volume = 1.0;
        u.onend = function() { resolve(); };
        u.onerror = function() { resolve(); };
        window.speechSynthesis.speak(u);
      });
    }

    function showReply(who, name, text) {
      var el = document.getElementById('reply');
      el.className = 'reply ' + who;
      el.innerHTML = '<div class="reply-label">' + name + '说：</div>' + text;
      el.style.display = 'block';
      clearTimeout(el._t);
      el._t = setTimeout(function() { el.style.display = 'none'; }, 60000);
    }

    function setStatus(msg) {
      var el = document.getElementById('status');
      el.textContent = msg;
    }
  </script>
</body>
</html>
