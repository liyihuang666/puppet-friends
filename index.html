<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新新和善善</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #fff8e1 100%);
      height: 100vh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
      user-select: none; -webkit-user-select: none;
    }
    .header {
      text-align: center; padding: 3vh 0 0;
    }
    .header h1 { font-size: 5vh; color: #e65100; letter-spacing: 6px; }
    .header p { font-size: 2.5vh; color: #8d6e63; }

    .mains {
      flex: 1; display: flex; justify-content: center; align-items: center;
      gap: 5vw; padding: 3vh 5vw;
    }
    .char {
      flex: 1; max-width: 40vw; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.15s;
      position: relative;
    }
    .char:active { transform: scale(0.95); }
    .char.recording .char-img {
      animation: recordPulse 0.8s ease-in-out infinite;
    }
    @keyframes recordPulse {
      0%,100% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 0 rgba(244,67,54,0.4); }
      50% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 30px rgba(244,67,54,0); }
    }
    .char.speaking .char-img {
      animation: bounce 0.35s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .char-img {
      width: 100%; aspect-ratio: 1;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      background: white;
    }
    .char-img img { width: 100%; height: 100%; object-fit: contain; }

    .char-name {
      font-size: 4vh; font-weight: bold; color: white;
      padding: 1vh 5vw; border-radius: 40px; margin-top: 1vh;
    }
    .char:nth-child(1) .char-name { background: #66bb6a; }
    .char:nth-child(2) .char-name { background: #ff9800; }
    .char-hint { font-size: 2vh; color: #8d6e63; margin-top: 0.5vh; }

    /* 录音指示器 */
    .record-indicator {
      position: absolute; top: -10px; right: -10px;
      width: 30px; height: 30px; border-radius: 50%;
      background: #f44336; display: none;
    }
    .char.recording .record-indicator { display: block; }

    /* 状态提示 */
    .status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 4vh; color: #555; pointer-events: none;
      background: rgba(255,255,255,0.9); padding: 2vh 4vw;
      border-radius: 20px; display: none; z-index: 50;
      text-align: center;
    }

    /* 回复气泡 */
    .reply {
      position: fixed; bottom: 8vh; left: 50%; transform: translateX(-50%);
      background: white; padding: 2.5vh 5vw; border-radius: 24px;
      font-size: 3.5vh; text-align: center; z-index: 50;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 75vw; line-height: 1.6;
      animation: popIn 0.4s ease;
      pointer-events: none;
    }
    .reply.xinxin { border: 4px solid #66bb6a; }
    .reply.shanshan { border: 4px solid #ff9800; }
    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .reply-label { font-size: 2.2vh; color: #888; margin-bottom: 0.5vh; }
  </style>
</head>
<body>
  <div class="header">
    <h1>新新 & 善善</h1>
    <p>闽南布偶戏服装设计</p>
  </div>

  <div class="mains">
    <div class="char" id="card-xinxin" data-char="xinxin">
      <div class="record-indicator"></div>
      <div class="char-img"><img src="img/xinxin.jpg" alt="新新"></div>
      <div class="char-name">新新</div>
      <div class="char-hint">👆 点我跟新新说话</div>
    </div>
    <div class="char" id="card-shanshan" data-char="shanshan">
      <div class="record-indicator"></div>
      <div class="char-img"><img src="img/shanshan.jpg" alt="善善"></div>
      <div class="char-name">善善</div>
      <div class="char-hint">👆 点我跟善善说话</div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="reply" id="reply" style="display:none"></div>

  <script>
    const API_KEY = '***';
    const ASR_API = 'https://api.siliconflow.cn/v1/audio/transcriptions';
    const LLM_API = 'https://api.siliconflow.cn/v1/chat/completions';
    const TTS_API = 'https://api.siliconflow.cn/v1/audio/speech';

    const PROMPTS = {
      xinxin: `你是"新新"，一只绿色青蛙布偶，闽南布偶戏的服装设计师。性格活泼好奇，喜欢问小朋友问题。
说话用词要像跟五岁小朋友聊天一样简单亲切。你最喜欢和小朋友讨论布偶衣服的颜色、花纹、面料。
每次回复控制在2-3句话，简短有趣。`,
      shanshan: `你是"善善"，一只棕色小狮子布偶，闽南布偶戏的服装设计师。性格温柔善良，喜欢鼓励小朋友。
说话用词要像跟五岁小朋友聊天一样简单亲切。你最喜欢夸小朋友的设计想法，给他们建议。
每次回复控制在2-3句话，简短有趣。`
    };

    let currentChar = null;
    let currentName = '';
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let isProcessing = false;
    let stream = null;

    // ========== 点击角色 ==========
    async function handleTap(who) {
      if (isProcessing) return;
      
      currentChar = who;
      currentName = who === 'xinxin' ? '新新' : '善善';
      const card = document.getElementById('card-' + who);

      if (isRecording) {
        // 正在录音，再次点击 = 停止录音并处理
        stopRecording();
        return;
      }

      // 开始录音
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => processAudio(who);
        
        mediaRecorder.start();
        isRecording = true;
        card.classList.add('recording');
        showStatus('🎤 正在听' + currentName + '说话...');

        // 最大录音10秒
        setTimeout(() => {
          if (isRecording && currentChar === who) stopRecording();
        }, 10000);

      } catch(e) {
        console.error('Mic error:', e);
        showStatus('❌ 麦克风没开，请检查权限');
        setTimeout(hideStatus, 2000);
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      mediaRecorder.stop();
      isRecording = false;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      document.getElementById('card-' + currentChar)?.classList.remove('recording');
      hideStatus();
    }

    // ========== 处理录音 ==========
    async function processAudio(who) {
      if (audioChunks.length === 0) return;
      
      isProcessing = true;
      showStatus('🔊 正在识别...');
      
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('file', audioBlob, 'recording.webm');
      formData.append('model', 'FunAudioLLM/SenseVoiceSmall');

      try {
        // 1. 语音转文字
        const asrRes = await fetch(ASR_API, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${API_KEY}` },
          body: formData
        });
        const asrData = await asrRes.json();
        const text = (asrData.text || '').trim();
        
        if (!text) {
          showStatus('😅 ' + currentName + '没听清，再点一下试试');
          setTimeout(hideStatus, 2000);
          isProcessing = false;
          return;
        }

        console.log('🎤 识别结果:', text);
        
        // 2. 角色思考动效
        showStatus('💭 ' + currentName + '正在思考...');
        const card = document.getElementById('card-' + who);
        card.classList.add('speaking');

        // 3. AI 回复
        const reply = await callLLM(who, text);
        hideStatus();
        showReply(who, currentName, reply);

        // 4. 语音朗读
        await speakText(reply);

      } catch(e) {
        console.error('Error:', e);
        showStatus('❌ ' + currentName + '走神了，再点一下');
        setTimeout(hideStatus, 2000);
      }

      setTimeout(() => {
        document.getElementById('card-' + who)?.classList.remove('speaking');
      }, 2000);
      
      isProcessing = false;
    }

    // ========== 大模型 ==========
    async function callLLM(character, userText) {
      const res = await fetch(LLM_API, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: 'deepseek-ai/DeepSeek-V3',
          messages: [
            { role: 'system', content: PROMPTS[character] },
            { role: 'user', content: userText }
          ],
          max_tokens: 200,
          temperature: 0.9
        })
      });
      const data = await res.json();
      return data.choices?.[0]?.message?.content || '嗯...让我想一想~';
    }

    // ========== 语音朗读 ==========
    async function speakText(text) {
      try {
        const res = await fetch(TTS_API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'FunAudioLLM/CosyVoice2-0.5B',
            input: text,
            voice: 'FunAudioLLM/CosyVoice2-0.5B:alex',
            response_format: 'mp3'
          })
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const audio = new Audio(URL.createObjectURL(blob));
        await audio.play();
      } catch(e) {
        console.error('TTS:', e);
      }
    }

    // ========== UI ==========
    function showStatus(text) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.style.display = 'block';
    }
    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }

    function showReply(character, name, text) {
      const el = document.getElementById('reply');
      el.className = 'reply ' + character;
      el.innerHTML = '<div class="reply-label">' + name + '说：</div>' + text;
      el.style.display = 'block';
      clearTimeout(el._timeout);
      el._timeout = setTimeout(() => { el.style.display = 'none'; }, 12000);
    }

    // ========== 事件绑定 ==========
    document.getElementById('card-xinxin').addEventListener('click', () => handleTap('xinxin'));
    document.getElementById('card-shanshan').addEventListener('click', () => handleTap('shanshan'));
  </script>
</body>
</html>
