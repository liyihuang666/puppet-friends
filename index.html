<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>新新和善善</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #fff8e1 100%);
      height: 100vh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .header {
      text-align: center; padding: 2.5vh 0 0;
    }
    .header h1 { font-size: 5vh; color: #e65100; letter-spacing: 6px; }
    .header p { font-size: 2.5vh; color: #8d6e63; }

    .mains {
      flex: 1; display: flex; justify-content: center; align-items: center;
      gap: 5vw; padding: 2vh 5vw;
    }
    .char {
      flex: 1; max-width: 40vw; display: flex; flex-direction: column; align-items: center;
      transition: transform 0.15s;
    }
    .char-img {
      width: 100%; aspect-ratio: 1;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      background: white; position: relative;
      cursor: pointer;
    }
    .char-img img { width: 100%; height: 100%; object-fit: contain; }

    /* 激活态光圈 */
    .char.active .char-img {
      animation: activePulse 2s ease-in-out infinite;
    }
    @keyframes activePulse {
      0%,100% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 0 rgba(102,187,106,0.5); }
      50% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 25px rgba(102,187,106,0); }
    }
    .char.speaking .char-img {
      animation: bounce 0.35s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .char-name {
      font-size: 4vh; font-weight: bold; color: white;
      padding: 1vh 5vw; border-radius: 40px; margin-top: 1vh;
    }
    .char:nth-child(1) .char-name { background: #66bb6a; }
    .char:nth-child(2) .char-name { background: #ff9800; }
    .char-status { font-size: 2vh; color: #888; margin-top: 0.5vh; }

    /* 状态提示 */
    .status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95); padding: 1.5vh;
      text-align: center; font-size: 2.2vh; color: #555;
      z-index: 100; display: none;
      border-bottom: 2px solid #eee;
    }

    /* 回复气泡 */
    .reply {
      position: fixed; bottom: 10vh; left: 50%; transform: translateX(-50%);
      background: white; padding: 3vh 6vw; border-radius: 24px;
      font-size: 3.5vh; text-align: center; z-index: 50;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 80vw; line-height: 1.6;
      animation: popIn 0.4s ease; pointer-events: none;
    }
    .reply.xinxin { border: 4px solid #66bb6a; }
    .reply.shanshan { border: 4px solid #ff9800; }
    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .reply-label { font-size: 2.2vh; color: #888; margin-bottom: 0.5vh; }

    /* 点击开始按钮 */
    .start-btn {
      position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
      background: #66bb6a; color: white; border: none;
      padding: 2vh 8vw; font-size: 3vh; border-radius: 50px;
      cursor: pointer; z-index: 60; font-weight: bold;
      box-shadow: 0 6px 20px rgba(102,187,106,0.4);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>新新 & 善善</h1>
    <p>闽南布偶戏服装设计</p>
  </div>

  <div class="mains">
    <div class="char" id="card-xinxin">
      <div class="char-img" onclick="startListening()">
        <img src="img/xinxin.jpg" alt="新新">
      </div>
      <div class="char-name">新新</div>
      <div class="char-status">👆 点我开始聊天</div>
    </div>
    <div class="char" id="card-shanshan">
      <div class="char-img" onclick="startListening()">
        <img src="img/shanshan.jpg" alt="善善">
      </div>
      <div class="char-name">善善</div>
      <div class="char-status">👆 点我开始聊天</div>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="startListening()">🎤 点这里开始聊天</button>

  <div class="status-bar" id="statusBar">🎤 在听了... 叫"新新"或"善善"就好</div>
  <div class="reply" id="reply" style="display:none"></div>

  <script>
    const API_KEY = '***';
    const ASR_API = 'https://api.siliconflow.cn/v1/audio/transcriptions';
    const LLM_API = 'https://api.siliconflow.cn/v1/chat/completions';
    const TTS_API = 'https://api.siliconflow.cn/v1/audio/speech';

    const PROMPTS = {
      xinxin: `你是"新新"，一只绿色青蛙布偶，闽南布偶戏的服装设计师。性格活泼好奇，喜欢问小朋友问题。
说话用词要像跟五岁小朋友聊天一样简单亲切。你最喜欢和小朋友讨论布偶衣服的颜色、花纹、面料。
每次回复控制在2-3句话，简短有趣。记得你的名字叫"新新"。`,
      shanshan: `你是"善善"，一只棕色小狮子布偶，闽南布偶戏的服装设计师。性格温柔善良，喜欢鼓励小朋友。
说话用词要像跟五岁小朋友聊天一样简单亲切。你最喜欢夸小朋友的设计想法，给他们建议。
每次回复控制在2-3句话，简短有趣。记得你的名字叫"善善"。`
    };

    let active = false;
    let speaking = false;
    let mediaRecorder = null;
    let stream = null;
    let audioContext = null;
    let analyser = null;
    let silenceTimer = null;

    // ========== 启动 ==========
    async function startListening() {
      if (active) return;
      
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        active = true;
        
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('statusBar').style.display = 'block';
        document.getElementById('card-xinxin').classList.add('active');
        document.getElementById('card-shanshan').classList.add('active');
        document.querySelectorAll('.char-status').forEach(el => el.textContent = '🎤 我在听哦~');

        // 新新打招呼
        setTimeout(async () => {
          await sayHello('xinxin', '小朋友们好！我是新新，今天我们一起设计闽南布偶戏的漂亮衣服吧！');
        }, 800);
        setTimeout(async () => {
          await sayHello('shanshan', '大家好呀，我是善善！有什么想问我的吗？');
        }, 3500);

        // 启动持续录音
        startContinuousRecording();

      } catch(e) {
        console.error('Mic error:', e);
        alert('请允许使用麦克风哦~');
      }
    }

    // ========== 打招呼 ==========
    async function sayHello(who, text) {
      const card = document.getElementById('card-' + who);
      card.classList.add('speaking');
      showReply(who, who === 'xinxin' ? '新新' : '善善', text);
      await speakText(text);
      setTimeout(() => card.classList.remove('speaking'), 1000);
    }

    // ========== 持续录音 ==========
    function startContinuousRecording() {
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      const chunks = [];
      
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      
      mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks, { type: 'audio/webm' });
        chunks.length = 0;
        
        if (blob.size < 500) {
          // 太小，跳过
          if (active) startRecorder();
          return;
        }

        showStatus('🔊 正在听...');
        
        const formData = new FormData();
        formData.append('file', blob, 'audio.webm');
        formData.append('model', 'FunAudioLLM/SenseVoiceSmall');

        try {
          const res = await fetch(ASR_API, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${API_KEY}` },
            body: formData
          });
          const data = await res.json();
          const text = (data.text || '').trim();
          
          if (text) {
            console.log('🎤 听到:', text);
            // 判断在叫谁
            const target = detectCharacter(text);
            if (target) {
              await handleSpeech(target, text);
            }
          }
        } catch(e) {
          console.error('ASR error:', e);
        }

        if (active) startRecorder();
      };

      startRecorder();
    }

    function startRecorder() {
      if (!active) return;
      mediaRecorder.start();
      // 每3秒切一段去识别
      setTimeout(() => {
        if (mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, 3000);
    }

    // ========== 判断在叫谁 ==========
    function detectCharacter(text) {
      const t = text.toLowerCase();
      if (t.includes('新新') || t.includes('新') || t.includes('青蛙') || t.includes('绿色')) return 'xinxin';
      if (t.includes('善善') || t.includes('善') || t.includes('狮子') || t.includes('棕色')) return 'shanshan';
      // 都没喊到就不回复
      return null;
    }

    // ========== 处理对话 ==========
    async function handleSpeech(who, text) {
      if (speaking) return;
      speaking = true;
      
      const name = who === 'xinxin' ? '新新' : '善善';
      const card = document.getElementById('card-' + who);
      card.classList.add('speaking');
      showStatus('💭 ' + name + '正在想...');

      try {
        const reply = await callLLM(who, text);
        showReply(who, name, reply);
        showStatus('🎤 在听了...');
        await speakText(reply);
      } catch(e) {
        console.error('LLM error:', e);
      }

      setTimeout(() => card.classList.remove('speaking'), 1000);
      speaking = false;
    }

    // ========== 大模型 ==========
    async function callLLM(character, userText) {
      const res = await fetch(LLM_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
        body: JSON.stringify({
          model: 'deepseek-ai/DeepSeek-V3',
          messages: [
            { role: 'system', content: PROMPTS[character] },
            { role: 'user', content: userText }
          ],
          max_tokens: 200,
          temperature: 0.9
        })
      });
      const data = await res.json();
      return data.choices?.[0]?.message?.content || '嗯...让我想一想~';
    }

    // ========== 语音朗读 ==========
    async function speakText(text) {
      try {
        const res = await fetch(TTS_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
          body: JSON.stringify({
            model: 'FunAudioLLM/CosyVoice2-0.5B',
            input: text,
            voice: 'FunAudioLLM/CosyVoice2-0.5B:alex',
            response_format: 'mp3'
          })
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const audio = new Audio(URL.createObjectURL(blob));
        await audio.play();
      } catch(e) { console.error('TTS:', e); }
    }

    // ========== UI ==========
    function showStatus(text) {
      document.getElementById('statusBar').textContent = text;
    }
    function showReply(character, name, text) {
      const el = document.getElementById('reply');
      el.className = 'reply ' + character;
      el.innerHTML = '<div class="reply-label">' + name + '说：</div>' + text;
      el.style.display = 'block';
      clearTimeout(el._timeout);
      el._timeout = setTimeout(() => { el.style.display = 'none'; }, 15000);
    }
  </script>
</body>
</html>
