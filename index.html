<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新新和善善</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #fff8e1 100%);
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .header {
      text-align: center; padding: 2vh 0 0;
    }
    .header h1 { font-size: 5vh; color: #e65100; letter-spacing: 6px; }
    .header p { font-size: 2.5vh; color: #8d6e63; }

    .mains {
      flex: 1; display: flex; justify-content: center; align-items: center;
      gap: 5vw; padding: 2vh 5vw;
    }
    .char {
      flex: 1; max-width: 40vw; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.3s;
    }
    .char:active { transform: scale(0.95); }
    .char.speaking { animation: bounce 0.5s ease-in-out infinite alternate; }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    .char-img {
      width: 100%; aspect-ratio: 1;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      background: white;
    }
    .char-img img { width: 100%; height: 100%; object-fit: contain; }

    .char-name {
      font-size: 4vh; font-weight: bold; color: white;
      padding: 1vh 5vw; border-radius: 40px; margin-top: 1vh;
    }
    .char:nth-child(1) .char-name { background: #66bb6a; }
    .char:nth-child(2) .char-name { background: #ff9800; }
    .char-hint { font-size: 2vh; color: #8d6e63; margin-top: 0.5vh; }

    /* 输入弹窗 */
    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 100;
      justify-content: center; align-items: center;
    }
    .overlay.show { display: flex; }
    .dialog {
      background: white; border-radius: 24px; padding: 4vh 5vw;
      width: 70vw; max-width: 500px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .dialog h2 { font-size: 4vh; margin-bottom: 2vh; }
    .dialog input {
      width: 100%; padding: 2vh; font-size: 3vh;
      border: 3px solid #ddd; border-radius: 16px; text-align: center;
      outline: none;
    }
    .dialog input:focus { border-color: #66bb6a; }
    .dialog .btns { display: flex; gap: 3vw; margin-top: 2vh; justify-content: center; }
    .dialog button {
      padding: 1.5vh 5vw; font-size: 2.5vh; border: none; border-radius: 30px;
      cursor: pointer; font-weight: bold;
    }
    .btn-ok { background: #66bb6a; color: white; }
    .btn-cancel { background: #ddd; color: #666; }

    /* 回复气泡 */
    .reply {
      position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
      background: white; padding: 2vh 5vw; border-radius: 20px;
      font-size: 3.5vh; text-align: center; z-index: 50;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      max-width: 75vw; line-height: 1.6;
      animation: popIn 0.4s ease;
    }
    .reply.xinxin { border: 3px solid #66bb6a; }
    .reply.shanshan { border: 3px solid #ff9800; }
    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .reply-label { font-size: 2vh; color: #888; margin-bottom: 0.5vh; }

    .waiting {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 3vh; color: #888; z-index: 49;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>新新 & 善善</h1>
    <p>闽南布偶戏服装设计</p>
  </div>

  <div class="mains">
    <div class="char" onclick="ask('xinxin')" id="card-xinxin">
      <div class="char-img"><img src="img/xinxin.jpg" alt="新新"></div>
      <div class="char-name">新新</div>
      <div class="char-hint">👆 点我跟新新聊天</div>
    </div>
    <div class="char" onclick="ask('shanshan')" id="card-shanshan">
      <div class="char-img"><img src="img/shanshan.jpg" alt="善善"></div>
      <div class="char-name">善善</div>
      <div class="char-hint">👆 点我跟善善聊天</div>
    </div>
  </div>

  <!-- 输入框 -->
  <div class="overlay" id="overlay">
    <div class="dialog">
      <h2 id="dialog-title">跟新新聊天</h2>
      <input type="text" id="dialog-input" placeholder="输入你想说的话..."
             autofocus>
      <div class="btns">
        <button class="btn-cancel" onclick="closeDialog()">取消</button>
        <button class="btn-ok" onclick="sendMessage()">发送 💬</button>
      </div>
    </div>
  </div>

  <!-- 等待提示 -->
  <div class="waiting" id="waiting" style="display:none">💭 正在思考...</div>
  <!-- 回复气泡 -->
  <div class="reply" id="reply" style="display:none"></div>

  <script>
    const API_KEY = '***';
    const LLM_API = 'https://api.siliconflow.cn/v1/chat/completions';
    const TTS_API = 'https://api.siliconflow.cn/v1/audio/speech';

    let currentChar = 'xinxin';
    let currentName = '新新';

    const PROMPTS = {
      xinxin: `你是"新新"，一只绿色青蛙布偶，闽南布偶戏的服装设计师。性格活泼好奇，喜欢问小朋友问题。
说话用词要像跟五岁小朋友聊天一样简单亲切。你最喜欢和小朋友讨论布偶衣服的颜色、花纹、面料。
每次回复控制在2-3句话，简短有趣。`,
      shanshan: `你是"善善"，一只棕色小狮子布偶，闽南布偶戏的服装设计师。性格温柔善良，喜欢鼓励小朋友。
说话用词要像跟五岁小朋友聊天一样简单亲切。你最喜欢夸小朋友的设计想法，给他们建议。
每次回复控制在2-3句话，简短有趣。`
    };

    function ask(who) {
      currentChar = who;
      currentName = who === 'xinxin' ? '新新' : '善善';
      document.getElementById('dialog-title').textContent = '跟' + currentName + '聊天 💬';
      document.getElementById('overlay').classList.add('show');
      setTimeout(() => document.getElementById('dialog-input').focus(), 200);
    }

    function closeDialog() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('dialog-input').value = '';
    }

    async function sendMessage() {
      const input = document.getElementById('dialog-input');
      const text = input.value.trim();
      if (!text) return;

      closeDialog();
      showWaiting();

      // 动效
      document.getElementById('card-' + currentChar).classList.add('speaking');

      try {
        const reply = await callLLM(currentChar, text);
        hideWaiting();
        showReply(currentChar, currentName, reply);
        speakText(reply);
      } catch(e) {
        hideWaiting();
        showReply(currentChar, currentName, '嗯...让我想想再回答你~');
      }

      setTimeout(() => {
        document.getElementById('card-' + currentChar).classList.remove('speaking');
      }, 2500);
    }

    async function callLLM(character, userText) {
      const res = await fetch(LLM_API, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: 'deepseek-ai/DeepSeek-V3',
          messages: [
            { role: 'system', content: PROMPTS[character] },
            { role: 'user', content: userText }
          ],
          max_tokens: 200,
          temperature: 0.9
        })
      });
      const data = await res.json();
      return data.choices?.[0]?.message?.content || '嗯...让我想一想~';
    }

    async function speakText(text) {
      try {
        const res = await fetch(TTS_API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'FunAudioLLM/CosyVoice2-0.5B',
            input: text,
            voice: 'FunAudioLLM/CosyVoice2-0.5B:alex',
            response_format: 'mp3'
          })
        });
        if (!res.ok) return;
        const blob = await res.blob();
        const audio = new Audio(URL.createObjectURL(blob));
        await audio.play();
      } catch(e) {
        console.log('TTS:', e);
      }
    }

    function showWaiting() {
      document.getElementById('waiting').style.display = 'block';
      document.getElementById('reply').style.display = 'none';
    }

    function hideWaiting() {
      document.getElementById('waiting').style.display = 'none';
    }

    function showReply(character, name, text) {
      const el = document.getElementById('reply');
      el.className = 'reply ' + character;
      el.innerHTML = '<div class="reply-label">' + name + '说：</div>' + text;
      el.style.display = 'block';
      // 5秒后自动消失
      clearTimeout(el._timeout);
      el._timeout = setTimeout(() => { el.style.display = 'none'; }, 8000);
    }

    // 键盘回车发送
    document.getElementById('dialog-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
