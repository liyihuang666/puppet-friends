<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>新新和善善</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #fff8e1 100%);
      height: 100vh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .header {
      text-align: center; padding: 2.5vh 0 0;
    }
    .header h1 { font-size: 5vh; color: #e65100; letter-spacing: 6px; }
    .header p { font-size: 2.5vh; color: #8d6e63; }

    .mains {
      flex: 1; display: flex; justify-content: center; align-items: center;
      gap: 5vw; padding: 2vh 5vw;
    }
    .char {
      flex: 1; max-width: 40vw; display: flex; flex-direction: column; align-items: center;
    }
    .char-img {
      width: 100%; aspect-ratio: 1;
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      background: white; position: relative;
      cursor: pointer;
    }
    .char-img img { width: 100%; height: 100%; object-fit: contain; }

    .char.active .char-img {
      animation: activePulse 2s ease-in-out infinite;
    }
    @keyframes activePulse {
      0%,100% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 0 rgba(102,187,106,0.5); }
      50% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 0 25px rgba(102,187,106,0); }
    }
    .char.speaking .char-img {
      animation: bounce 0.35s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .char-name {
      font-size: 4vh; font-weight: bold; color: white;
      padding: 1vh 5vw; border-radius: 40px; margin-top: 1vh;
    }
    .char:nth-child(1) .char-name { background: #66bb6a; }
    .char:nth-child(2) .char-name { background: #ff9800; }
    .char-status { font-size: 2vh; color: #888; margin-top: 0.5vh; }

    .status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.95); padding: 1.5vh;
      text-align: center; font-size: 2.2vh; color: #555;
      z-index: 100; display: none;
      border-bottom: 2px solid #eee;
    }

    .reply {
      position: fixed; bottom: 10vh; left: 50%; transform: translateX(-50%);
      background: white; padding: 3vh 6vw; border-radius: 24px;
      font-size: 3.5vh; text-align: center; z-index: 50;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 80vw; line-height: 1.6;
      animation: popIn 0.4s ease; pointer-events: none;
    }
    .reply.xinxin { border: 4px solid #66bb6a; }
    .reply.shanshan { border: 4px solid #ff9800; }
    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .reply-label { font-size: 2.2vh; color: #888; margin-bottom: 0.5vh; }

    .start-btn {
      position: fixed; bottom: 5vh; left: 50%; transform: translateX(-50%);
      background: #66bb6a; color: white; border: none;
      padding: 2vh 8vw; font-size: 3vh; border-radius: 50px;
      cursor: pointer; z-index: 60; font-weight: bold;
      box-shadow: 0 6px 20px rgba(102,187,106,0.4);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>新新 & 善善</h1>
    <p>闽南布偶戏服装设计</p>
  </div>

  <div class="mains">
    <div class="char" id="card-xinxin">
      <div class="char-img" onclick="startListening()">
        <img src="img/xinxin.jpg" alt="新新">
      </div>
      <div class="char-name">新新</div>
      <div class="char-status">👆 点我开始聊天</div>
    </div>
    <div class="char" id="card-shanshan">
      <div class="char-img" onclick="startListening()">
        <img src="img/shanshan.jpg" alt="善善">
      </div>
      <div class="char-name">善善</div>
      <div class="char-status">👆 点我开始聊天</div>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="startListening()">🎤 点这里开始聊天</button>

  <div class="status-bar" id="statusBar">🎤 在听了... 叫"新新"或"善善"就好</div>
  <div class="reply" id="reply" style="display:none"></div>

  <script>
    // ========== 配置 ==========
    const LLM_API = 'https://api.deepseek.com/v1/chat/completions';
    const API_KEY = 'sk-a303115c038d475e86f38171a2cf1d21';

    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var recognition = null;
    var active = false;
    var speaking = false;
    var finalTranscript = '';
    var restartTimer = null;

    // 检查浏览器支持
    if (!SpeechRecognition) {
      alert('当前浏览器不支持语音识别，请使用 Safari 或 Chrome 打开');
    }

    function startListening() {
      if (active) return;
      
      active = true;
      document.getElementById('startBtn').style.display = 'none';
      
      // 激活两个角色
      document.getElementById('card-xinxin').classList.add('active');
      document.getElementById('card-shanshan').classList.add('active');
      document.querySelectorAll('.char-status').forEach(el => el.textContent = '🎤 喊"新新"或"善善"');

      // 打招呼
      setTimeout(() => sayHello('xinxin', '小朋友们好！我是新新，今天我们一起给闽南布偶设计漂亮衣服吧！'), 300);
      setTimeout(() => sayHello('shanshan', '大家好呀，我是善善！来看看我们的新衣服吧~'), 2800);

      // 启动语音识别
      startRecognition();
    }

    // ========== 打招呼 ==========
    async function sayHello(who, text) {
      showReply(who, who === 'xinxin' ? '新新' : '善善', text);
      const card = document.getElementById('card-' + who);
      card.classList.add('speaking');
      speak(text);
      setTimeout(() => card.classList.remove('speaking'), 1200);
    }

    // ========== 持续语音识别 ==========
    function startRecognition() {
      if (!active || speaking) {
        // 如果正在说话，稍后再试
        if (speaking) { restartTimer = setTimeout(startRecognition, 500); }
        return;
      }
      
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      
      finalTranscript = '';
      
      recognition.onresult = function(event) {
        var interim = '';
        var final = '';
        
        for (var i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        
        if (final) finalTranscript += final;
        
        // 显示识别到的内容
        var display = finalTranscript || interim;
        if (display) {
          showStatus('🎧 听到: "' + display + '"');
        }
        
        // 检测关键词
        var checkText = (finalTranscript + ' ' + interim).toLowerCase();
        var target = null;
        if (checkText.includes('新新') || checkText.includes('新') && checkText.includes('青蛙')) {
          target = 'xinxin';
        } else if (checkText.includes('善善') || checkText.includes('善') && checkText.includes('狮子')) {
          target = 'shanshan';
        }
        
        if (target && finalTranscript) {
          handleSpeech(target, finalTranscript);
          finalTranscript = '';
        }
      };

      recognition.onerror = function(event) {
        console.log('Recognition error:', event.error);
        if (event.error === 'no-speech' || event.error === 'aborted') {
          // 正常情况，重启
          setTimeout(() => { if (active && !speaking) startRecognition(); }, 300);
          return;
        }
        if (event.error === 'not-allowed') {
          showStatus('❌ 请允许使用麦克风，刷新页面再试');
          return;
        }
        // 其他错误，重新启动
        setTimeout(() => { if (active && !speaking) startRecognition(); }, 500);
      };

      recognition.onend = function() {
        // 自动重启
        if (active && !speaking) {
          setTimeout(() => startRecognition(), 200);
        }
      };

      try {
        recognition.start();
        showStatus('🎤 在听了...');
      } catch(e) {
        console.log('Start error:', e);
        setTimeout(() => { if (active && !speaking) startRecognition(); }, 500);
      }
    }

    // ========== 处理对话 ==========
    async function handleSpeech(who, text) {
      if (speaking) return;
      speaking = true;
      
      // 暂停识别
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      clearTimeout(restartTimer);
      
      var name = who === 'xinxin' ? '新新' : '善善';
      var card = document.getElementById('card-' + who);
      card.classList.add('speaking');
      showStatus('💭 ' + name + '正在思考...');

      try {
        var reply = await callLLM(who, text);
        showReply(who, name, reply);
        showStatus('🔊 ' + name + '正在说话...');
        
        // 朗读
        var spoken = await speak(reply);
        
        // 说完后恢复识别
        card.classList.remove('speaking');
        speaking = false;
        showStatus('🎤 在听了...');
        
        if (active) {
          setTimeout(() => startRecognition(), 500);
        }
      } catch(e) {
        console.error('LLM error:', e);
        card.classList.remove('speaking');
        speaking = false;
        showStatus('🎤 在听了...');
        if (active) {
          setTimeout(() => startRecognition(), 500);
        }
      }
    }

    // ========== DeepSeek 大模型 ==========
    async function callLLM(character, userText) {
      var prompts = {
        xinxin: '你是"新新"，绿色青蛙布偶，闽南布偶戏服装设计师。性格活泼好奇。对五岁小朋友说话，用词简单可爱。每次2-3句话。',
        shanshan: '你是"善善"，棕色狮子布偶，闽南布偶戏服装设计师。性格温柔善良。对五岁小朋友说话，用词简单可爱。每次2-3句话。'
      };
      
      var res = await fetch(LLM_API, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [
            { role: 'system', content: prompts[character] },
            { role: 'user', content: userText }
          ],
          max_tokens: 150,
          temperature: 0.9
        })
      });
      
      var data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    }

    // ========== 语音朗读（系统自带） ==========
    function speak(text) {
      return new Promise(function(resolve) {
        if (!window.speechSynthesis) {
          resolve();
          return;
        }
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 1.1;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        utterance.onend = function() { resolve(); };
        utterance.onerror = function() { resolve(); };
        window.speechSynthesis.speak(utterance);
      });
    }

    // ========== UI ==========
    function showStatus(text) {
      var el = document.getElementById('statusBar');
      el.textContent = text;
      el.style.display = 'block';
    }
    
    function showReply(character, name, text) {
      var el = document.getElementById('reply');
      el.className = 'reply ' + character;
      el.innerHTML = '<div class="reply-label">' + name + '说：</div>' + text;
      el.style.display = 'block';
      clearTimeout(el._timeout);
      el._timeout = setTimeout(function() { el.style.display = 'none'; }, 20000);
    }
  </script>
</body>
</html>
