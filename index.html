<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>新新和善善</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e8f5e9 50%, #fff8e1 100%);
      height: 100vh; height: 100dvh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .header { text-align: center; padding: 2.5vh 0 0; }
    .header h1 { font-size: 5vh; color: #e65100; letter-spacing: 6px; }
    .header p { font-size: 2.5vh; color: #8d6e63; }

    .mains {
      flex: 1; display: flex; justify-content: center; align-items: center;
      gap: 5vw; padding: 2vh 5vw;
    }
    .char {
      flex: 1; max-width: 40vw; display: flex; flex-direction: column; align-items: center;
    }
    .char-img {
      width: 100%; aspect-ratio: 1; border-radius: 28px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15); background: white;
    }
    .char-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .char.speaking .char-img { animation: bounce 0.3s ease-in-out infinite alternate; }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    .char-name {
      font-size: 4vh; font-weight: bold; color: white;
      padding: 1vh 5vw; border-radius: 40px; margin-top: 1vh;
    }
    .char:nth-child(1) .char-name { background: #66bb6a; }
    .char:nth-child(2) .char-name { background: #ff9800; }

    .reply {
      position: fixed; bottom: 10vh; left: 50%; transform: translateX(-50%);
      background: white; padding: 3vh 6vw; border-radius: 24px;
      font-size: 3.5vh; text-align: center; z-index: 99;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 80vw; line-height: 1.6;
      animation: popIn 0.4s ease; pointer-events: none;
      display: none;
    }
    .reply.xinxin { border: 4px solid #66bb6a; }
    .reply.shanshan { border: 4px solid #ff9800; }
    @keyframes popIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .reply-label { font-size: 2.2vh; color: #888; margin-bottom: 0.5vh; }

    .status {
      position: fixed; top: 1vh; left: 0; right: 0; text-align: center;
      font-size: 2vh; color: #888; z-index: 98; pointer-events: none;
    }

    /* 大大的开始按钮 */
    .start-btn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: linear-gradient(135deg, #66bb6a, #43a047);
      color: white; border: none;
      padding: 4vh 12vw; font-size: 5vh; border-radius: 60px;
      font-weight: bold; cursor: pointer; z-index: 200;
      box-shadow: 0 10px 40px rgba(76,175,80,0.5);
      letter-spacing: 4px;
      animation: btnPulse 2s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%,100% { transform: translate(-50%,-50%) scale(1); }
      50% { transform: translate(-50%,-50%) scale(1.05); }
    }

    /* 提示覆盖层 */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 199;
      display: flex; justify-content: center; align-items: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>新新 & 善善</h1>
    <p>闽南布偶戏服装设计</p>
  </div>

  <div class="mains">
    <div class="char" id="card-xinxin">
      <div class="char-img"><img src="img/xinxin.jpg" alt="新新"></div>
      <div class="char-name">新新</div>
    </div>
    <div class="char" id="card-shanshan">
      <div class="char-img"><img src="img/shanshan.jpg" alt="善善"></div>
      <div class="char-name">善善</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <button class="start-btn" id="startBtn" onclick="start()">🎤 开始</button>
  </div>

  <div class="status" id="status"></div>
  <div class="reply" id="reply"></div>

  <script>
    var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    var API_KEY = '***';
    var LLM_API = 'https://api.deepseek.com/v1/chat/completions';

    var running = false;
    var busy = false;
    var recog = null;

    var PROMPTS = {
      xinxin: '你是"新新"，绿色青蛙布偶，闽南布偶戏服装设计师。活泼好奇。对五岁小孩说话，简单可爱。1-2句话，短！',
      shanshan: '你是"善善"，棕色狮子布偶，闽南布偶戏服装设计师。温柔善良。对五岁小孩说话，简单可爱。1-2句话，短！'
    };

    function start() {
      document.getElementById('overlay').style.display = 'none';
      running = true;
      setStatus('🎤 孩子们，来跟新新善善说说话吧！');
      
      // 打招呼
      setTimeout(function() { replyFor('xinxin', '小朋友们大家好呀！我跟大家打个招呼，我是新新，今天我们一起设计闽南布偶戏的漂亮衣服吧！你们想给布偶穿什么颜色的衣服呀？'); }, 1000);
      setTimeout(function() { replyFor('shanshan', '小朋友们好！我是善善，我最喜欢看大家设计的衣服了！谁想先来跟我说说你的想法呀？'); }, 5000);
      
      // 启动持续监听
      keepListening();
    }

    function keepListening() {
      if (!running) return;
      if (busy) { setTimeout(keepListening, 1000); return; }
      
      if (!Recognition) { setTimeout(keepListening, 2000); return; }
      
      recog = new Recognition();
      recog.lang = 'zh-CN';
      recog.continuous = false;
      recog.interimResults = false;
      recog.maxAlternatives = 1;

      var gotText = '';

      recog.onresult = function(e) {
        gotText = e.results[0][0].transcript;
      };

      recog.onerror = function(e) {
        if (e.error === 'no-speech' || e.error === 'aborted') {
          // 正常，继续听
          setTimeout(keepListening, 500);
          return;
        }
        console.log('Err:', e.error);
        setTimeout(keepListening, 2000);
      };

      recog.onend = function() {
        if (gotText && gotText.trim()) {
          var text = gotText.trim();
          console.log('听到:', text);
          
          var who = detectWho(text);
          if (who) {
            handleSpeech(who, text);
          } else {
            // 没叫到名字，继续听
            setStatus('🎤 听到了，但没叫新新或善善...');
            setTimeout(keepListening, 1000);
          }
        } else {
          // 没说话，继续听
          setTimeout(keepListening, 500);
        }
      };

      try {
        recog.start();
      } catch(e) {
        setTimeout(keepListening, 1000);
      }
    }

    function detectWho(text) {
      var t = text.replace(/[，。！？、\s]/g, '').toLowerCase();
      if (t.indexOf('新新') >= 0 || t.indexOf('新') >= 0 || t.indexOf('青蛙') >= 0) return 'xinxin';
      if (t.indexOf('善善') >= 0 || t.indexOf('善') >= 0 || t.indexOf('狮子') >= 0) return 'shanshan';
      return null;
    }

    async function handleSpeech(who, text) {
      if (busy) return;
      busy = true;
      
      var name = who === 'xinxin' ? '新新' : '善善';
      var card = document.getElementById('card-' + who);
      
      card.classList.add('speaking');
      setStatus('💭 ' + name + '在想...');

      try {
        var reply = await callLLM(who, text);
        showReply(who, name, reply);
        setStatus('🔊 ' + name + '在说话...');
        
        await speak(reply);
      } catch(e) {
        console.error('AI出错:', e);
      }

      card.classList.remove('speaking');
      setStatus('🎤 继续聊吧~');
      
      setTimeout(function() {
        busy = false;
        keepListening();
      }, 1500);
    }

    async function replyFor(who, text) {
      busy = true;
      var name = who === 'xinxin' ? '新新' : '善善';
      var card = document.getElementById('card-' + who);
      
      card.classList.add('speaking');
      showReply(who, name, text);
      setStatus('🔊 ' + name + '在说话...');
      
      await speak(text);
      
      card.classList.remove('speaking');
      setStatus('🎤');
      
      setTimeout(function() {
        busy = false;
        keepListening();
      }, 1500);
    }

    async function callLLM(who, text) {
      var res = await fetch(LLM_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': '***' + API_KEY },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [
            { role: 'system', content: PROMPTS[who] },
            { role: 'user', content: text }
          ],
          max_tokens: 150, temperature: 0.9
        })
      });
      var data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    }

    function speak(text) {
      return new Promise(function(resolve) {
        if (!window.speechSynthesis) { resolve(); return; }
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 1.0; u.pitch = 1.2; u.volume = 1.0;
        u.onend = function() { resolve(); };
        u.onerror = function() { resolve(); };
        window.speechSynthesis.speak(u);
      });
    }

    function showReply(who, name, text) {
      var el = document.getElementById('reply');
      el.className = 'reply ' + who;
      el.innerHTML = '<div class="reply-label">' + name + '说：</div>' + text;
      el.style.display = 'block';
      clearTimeout(el._t);
      el._t = setTimeout(function() { el.style.display = 'none'; }, 30000);
    }

    function setStatus(msg) {
      var el = document.getElementById('status');
      el.textContent = msg;
      if (msg) el.style.display = 'block';
      else el.style.display = 'none';
    }
  </script>
</body>
</html>
